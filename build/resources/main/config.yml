database:
  type: sqlite
  mysql:
    host: "localhost"
    port: 3306
    database: "velocityutils"
    username: "root"
    password: ""

alert:
  enabled: true
  sound: "BLOCK_NOTE_BLOCK_PLING"
  message:
    - "&f-----------------------------"
    - "&7[&b&lSERVER&7] &r{message}"
    - "&f-----------------------------"
  title:
    enabled: true
    title: "&7[&b&lSERVER&7]"
    subtitle: "{message}"
    durations:
      fade_in: 20
      stay: 60
      fade_out: 20
  actionbar:
    enabled: true
    message: "&7[&b&lSERVER&7] &r{message}"
  bossbar:
    enabled: true
    message: "&7[&b&lSERVER&7] &r{message}"
    color: BLUE
    overlay: PROGRESS
    duration: 5
motd:
  enabled: true
  line1: "&aWelcome to this Velocity Server!"
  line2: "<bold><gradient:yellow:green>Enjoy your stay</gradient></bold>"
maintenance:
  enabled: true
  active: false
  motd:
    line1: "&cServer under maintenance!"
    line2: "<bold><gradient:red:yellow>Try again later</gradient></bold>"
report:
  enabled: true
  teleport_on_click: true
  message:
    - "&f-----------------------------"
    - "&eNew Report from {player}!"
    - "&fReported: &c{reported}"
    - "&fReason: &b{reason}"
    - "&fServer: &b{server}"
    - "&eClick to teleport"
    - "&f-----------------------------"
  discord_hook:
    enabled: false
    url: "https://discord.com/api/webhooks/xxxxxxxx/yyyyyyyyyyyy"
    avatar: 'https://www.spigotmc.org/data/resource_icons/123/123517.jpg?1742847968'
    username: 'VelocityUtils'
    color_rgb: "240,43,20"
    title: '📢User Report📢'
    message: |
      📢 **New Report from {reporter}**
      👤 **Reported:** {reported}
      📄 **Reason:** {reason}
      🌍 **Server:** {server}
helpop:
  enabled: true
  teleport_on_click: true
  message:
    - "&f-----------------------------"
    - "&eNew Help Request from {player}!"
    - "&fReason: &b{reason}"
    - "&fServer: &b{server}"
    - "&eClick to teleport"
    - "&f-----------------------------"
  discord_hook:
    enabled: false
    url: "https://discord.com/api/webhooks/xxxxxxxx/yyyyyyyyyyyy"
    avatar: 'https://www.spigotmc.org/data/resource_icons/123/123517.jpg?1742847968'
    username: 'VelocityUtils'
    color_rgb: "227,230,14"
    title: '📢Help Request📢'
    message: |
      📢 **New Help Request from {player}**
      📄 **Reason:** {reason}
      🌍 **Server:** {server}
staffchat:
  enabled: true
  discord_hook:
    enabled: false
    url: "https://discord.com/api/webhooks/xxxxxxxx/yyyyyyyyyyyy"
    avatar: 'https://www.spigotmc.org/data/resource_icons/123/123517.jpg?1742847968'
    username: 'VelocityUtils'
    color_rgb: "20,200,240"
    title: '🗨️Staff Chat🗨️'
    message: |
      🗨️ **Staff Chat from {player}**
      🌍 **Server:** {server}
      💬 **Message:** {message}
adminchat:
  enabled: true
  discord_hook:
    enabled: false
    url: "https://discord.com/api/webhooks/xxxxxxxx/yyyyyyyyyyyy"
    avatar: 'https://www.spigotmc.org/data/resource_icons/123/123517.jpg?1742847968'
    username: 'VelocityUtils'
    color_rgb: "196,3,184"
    title: '🗨️Admin Chat🗨️'
    message: |
      🗨️ **Admin Chat from {player}**
      🌍 **Server:** {server}
      💬 **Message:** {message}
stafftime:
  week_start: "MONDAY"
  discord_hook:
    enabled: false
    join:
      enabled: true
      url: "https://discord.com/api/webhooks/xxxxxxxx/yyyyyyyyyyyy"
      avatar: 'https://www.spigotmc.org/data/resource_icons/123/123517.jpg?1742847968'
      username: 'VelocityUtils'
      color_rgb: "45,255,0"
      title: '🕒Staff Join🕒'
      message: |
          🕒 **{player}** joined the server
    change:
      enabled: true
      url: "https://discord.com/api/webhooks/xxxxxxxx/yyyyyyyyyyyy"
      avatar: 'https://www.spigotmc.org/data/resource_icons/123/123517.jpg?1742847968'
      username: 'VelocityUtils'
      color_rgb: "255,255,0"
      title: '🕒Staff Change🕒'
      message: |
        🕒 **{player}** changed the server
        📋 {from} > {to}
    leave:
      enabled: true
      url: "https://discord.com/api/webhooks/xxxxxxxx/yyyyyyyyyyyy"
      avatar: 'https://www.spigotmc.org/data/resource_icons/123/123517.jpg?1742847968'
      username: 'VelocityUtils'
      color_rgb: "255,0,0"
      title: '🕒Staff Leave🕒'
      message: |
        🕒 **{player}** left the server
        📅 Time today: {time_daily}
        📅 Time this week: {time_weekly}
        📅 Time this month: {time_monthly}
        📋 {time} this session
        🖊️ Servers this session:
        {serverstime}
      serverstime: "- {server} - {time}"
  command:
    enabled: true
    no_type:
      - "&f-----------------------------"
      - "&eStaff Time from {player}"
      - "&fToday: &b{day}"
      - "&fWeek: &b{week}"
      - "&fMonth: &b{month}"
      - "&f-----------------------------"
    type:
      - "&f-----------------------------"
      - "&eStaff Time from {player} ({type})"
      - "&f{type}: &b{time}"
      - "&f-----------------------------"
    day: "Day"
    week: "Week"
    month: "Month"
vlist:
  enabled: true
  default_mode: "server"
  server:
    message:
      - "&f-----------------------------"
      - "&eThere are {count} players online"
      - "{servercount}"
      - "&f-----------------------------"
    servercount: "&7[&b{server} &7(&b{count}&7)] - &f{players}"
  rank:
    message:
      - "&f-----------------------------"
      - "&eThere are {count} players online"
      - "{rankcount}"
      - "&f-----------------------------"
    rankcount: "&7[&b{rank} &7(&b{count}&7)] - &f{players}"
